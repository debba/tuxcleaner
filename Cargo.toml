[package]
name = "tuxcleaner"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "A safety-first Linux cleanup, application uninstall, and disk analysis toolkit"
license = "GPL-3.0-only"
repository = "https://github.com/debba/tuxcleaner"
keywords = ["linux", "cleanup", "uninstall", "disk", "tui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
dialoguer = "0.12"
ratatui = "0.30"
flate2 = "1.1"
fs2 = "0.4"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
self-replace = "1.5"
tar = "0.4"
thiserror = "2.0"
tempfile = "3.20"
rayon = "1.10"
ureq = { version = "3.3", features = ["json"] }
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
strip = true
